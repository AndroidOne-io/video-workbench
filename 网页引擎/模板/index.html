<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪辑预览</title>
<style>
  @font-face { font-family: 'Sub'; src: local('PingFang SC'), local('Noto Sans CJK SC'), local('Arial'); }
  @font-face { font-family: 'Num'; src: local('PingFang SC'), local('Noto Sans CJK SC'), local('Arial'); }
  @font-face { font-family: 'Title'; src: local('PingFang SC'), local('Noto Sans CJK SC'), local('Arial'); }
  @font-face { font-family: 'Sharp'; src: local('PingFang SC'), local('Noto Sans CJK SC'), local('Arial'); }
  @font-face { font-family: 'Hand'; src: local('PingFang SC'), local('Noto Sans CJK SC'), local('Arial'); }
  :root { --bg: #0d0e12; --panel: #17181e; --line: #2a2c35; --fg: #e8e9ee; --dim: #8b8e9a; --gold: #ecc67a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 16px 0; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #bar { padding: 10px 16px 14px; display: grid; gap: 8px; }
  #row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, select, input[type="number"] { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; }
  button, select { cursor: pointer; }
  .speed-control { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  #speed { width: 82px; font-variant-numeric: tabular-nums; }
  button:hover, select:hover { border-color: #444857; }
  #play { min-width: 64px; }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 150px; }
  #shotName { color: var(--dim); flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #track { position: relative; height: 26px; cursor: pointer; }
  #track .bg { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--line); border-radius: 2px; }
  #track .fill { position: absolute; left: 0; top: 11px; height: 4px; background: var(--gold); border-radius: 2px; }
  #track .tick { position: absolute; top: 7px; width: 1px; height: 12px; background: #3a3d48; }
  #track .head { position: absolute; top: 5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px rgba(236,198,122,.25); }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,14,18,.92); font-size: 16px; z-index: 9; }
  .hint { color: var(--dim); font-size: 12px; }
  #warn { display: none; position: fixed; left: 16px; right: 16px; top: 12px; padding: 10px 14px; border-radius: 8px; background: #5a1f22; color: #ffd9d6; z-index: 8; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <div id="track"><div class="bg"></div><div class="fill" id="fill"></div><div class="head" id="head"></div></div>
  <div id="row">
    <button id="play">▶ 播放</button>
    <span id="time">0:00.0 / 0:00.0</span>
    <label class="speed-control"><input id="speed" type="number" min="0.25" max="4" step="0.01" value="1.00" aria-label="播放速度" title="输入 0.25–4.00，精确到 0.01，回车生效">×</label>
    <select id="speedPreset" aria-label="常用倍速" title="常用倍速">
      <option value="" disabled>自定义</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1× 正常</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <select id="jump"></select>
    <span id="shotName"></span>
    <button id="full">全屏</button>
    <span class="hint">空格 播放/暂停 · ← → 前后 1 秒 · , . 逐帧</span>
    <span class="hint" id="fps"></span>
  </div>
</div>
<div id="load">正在加载素材…</div>
<div id="warn"></div>
<audio id="mix" src="mix.wav" preload="auto"></audio>
<script src="data.js"></script>
<script src="sources.js"></script>
<script src="assets.js"></script>
<script src="engine.js"></script>
<script src="common.js"></script>
<script src="scenes.js"></script>
<script src="player.js"></script>
</body>
</html>
